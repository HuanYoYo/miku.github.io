<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <title>SHOOTING STAR | 相册</title>
    <script src="//xc.mikux.fun/laodongjiaoyu/gsap.js"></script>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        
        body, html
        {
            touch-action: none; /* 禁用浏览器默认的触摸滚动 */
            overscroll-behavior: none;/* 防止滚动超出边界 */
        }
        
        img
        {
            pointer-events: none;
            user-select: none;
        }
        
        div
        {
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }
        
        body
        {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
            background-color: #171717;
            overflow: hidden;
        }
        
        .photos
        {
            position: absolute;
            flex-direction: column;
            overflow: hidden;
            cursor: pointer;
        }
        
        .photos_line
        {
            font-size: 1px;
            height: 342em;
            margin-bottom: 48em;
            flex-shrink: 0;
        }
        
        .photos_line_photo
        {
            font-size: 1px;
            width: 234em;
            height: 100%;
            margin-right: 36em;
            border-radius: 15em;
            background-color: #17f700;
            overflow: hidden;
            flex-shrink: 0;
        }

        .photos_line_photo img
        {
            height: 100%;
            transition: 0.3s ease;
        }

        .photos_line_photo:hover img
        {
            transform: scale(1.2);
        }

        @media screen and (max-aspect-ratio: 1.5/1)
        {
            .photos_line,
            .photos_line_photo
            {
                font-size: 2px;
            }
        }

        @media screen and (max-aspect-ratio: 0.8/1)
        {

            .photos_line,
            .photos_line_photo
            {
                font-size: 2.8px;
            }
        }
        /* 底部圆角矩形长条样式 */
        .bottom-bar
        {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 250px;
            padding: 10px 10px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000; /* 确保显示在最前面 */
        }

        /* 按钮样式 */
        .button
        {
            width: 80px;
            height: 40px;
            background: rgba(255, 255, 255, 0.3);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* 鼠标悬停时的按钮效果 */
        .button:hover
        {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter:blur(15px)
            transform: scale(1.1);
        }
        /* 全屏提示样式 */
        #mobile-alert
        {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8); /* 深色背景带透明度 */
            backdrop-filter: blur(10px); /* 模糊效果 */
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: fadeIn 0.5s ease; /* 动效 */
        }
        /* 动效 */
        @keyframes fadeIn
        {
            from
            {
                opacity: 0;
            }
            to
            {
                opacity: 1;
            }
        }
        /* 确认按钮样式 */
        #mobile-alert button
        {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        #mobile-alert button:hover
        {
            background-color: #0056b3;
        }
        /* 鼠标悬停图片的圆角矩形衬底和放大按钮样式 */
        .photos_line_photo {
            position: relative;
            overflow: hidden;
            display: inline-block;
            margin: 10px; /* 添加间距 */
        }
        
        .photos_line_photo:hover .hover-overlay {
            opacity: 1;
        }
        
        .hover-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .zoom-icon {
            color: white;
            font-size: 24px;
            pointer-events: none; /* 禁用鼠标事件 */
        }
        
        /* 弹窗样式 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 20px;
            width: 80%;
            max-width: 800px;
            display: flex;
            overflow: hidden;
            position: relative;
        }
        
        .modal-left {
            flex: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            padding: 20px;
        }

        .modal-left img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 15px;
        }
        
        .modal-right {
            flex: 3;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
        }
        
        .comment {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }
        
        .comment-info {
            flex: 1;
        }
        
        .username {
            font-weight: bold;
            margin: 0;
        }
        
        .comment-text {
            margin: 5px 0 0 0;
        }
        
        .comment-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            resize: none;
        }

        .submit-button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        
        .submit-button:hover {
            background: #0056b3;
        }
        
        .close-button {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 24px;
            color: #333;
            cursor: pointer;
        }
    </style>
</head>

<script>
    // 本网站基于 JIEJOE produce 开发模板修改实现
    // b站主页：https://space.bilibili.com/3546390319860710
    const photobox = {
        container: document.querySelector(".photos"),
        img_data: [],
        container_width: 0,
        container_height: 0,
        photo_width: 0,
        photo_height: 0,
        if_movable: false,
        mouse_x: 0,
        mouse_y: 0,
        standard_width: 1440,
        scale_nums: 1,
        init()
        {
            this.resize();
            window.addEventListener("resize", () => this.resize());
            window.addEventListener("orientationchange", () => this.resize());
            //支持触摸事件
            this.container.addEventListener("mousedown", (e) => this.startMove(e));
            this.container.addEventListener("mouseup", () => this.endMove());
            this.container.addEventListener("mouseleave", () => this.endMove());
            this.container.addEventListener("mousemove", (e) => this.move(e.clientX, e.clientY));
            this.container.addEventListener("touchstart", (e) => this.startMove(e.touches[0]));
            this.container.addEventListener("touchend", () => this.endMove());
            this.container.addEventListener("touchcancel", () => this.endMove());
            this.container.addEventListener("touchmove", (e) => this.move(e.touches[0].clientX, e.touches[0].clientY));
        },
        startMove(event) {
            this.if_movable = true;
            this.mouse_x = event.clientX;
            this.mouse_y = event.clientY;
        },
        endMove()
        {
            this.if_movable = false;
        },
        resize()
        {
            let imgs = [...document.querySelectorAll(".photos_line_photo")];
            this.container_width = this.container.offsetWidth;
            this.container_height = this.container.offsetHeight;
            this.photo_width = imgs[0].offsetWidth;
            this.photo_height = imgs[0].offsetHeight;
            this.scale_nums = document.body.offsetWidth / this.standard_width;
            this.container.style.transform = `scale(${this.scale_nums})`;
            gsap.to(imgs, { transform: `translate(0,0)`, duration: 0 });
            
            this.img_data = imgs.map((img) => (
            {
                node: img,
                x: img.offsetLeft,
                y: img.offsetTop,
                mov_x: 0,
                mov_y: 0,
                ani: 0,
            }));
        },
        move(x, y)
        {
            if (!this.if_movable) return;
            let distance_x = (x - this.mouse_x) / this.scale_nums;
            let distance_y = (y - this.mouse_y) / this.scale_nums;

            this.img_data.forEach((img) =>
            {
                let duration = 0.5; //快速动画
                img.mov_x += distance_x;
                img.mov_y += distance_y;

                if (img.x + img.mov_x > this.container_width) img.mov_x -= this.container_width;
                if (img.x + img.mov_x < -this.photo_width) img.mov_x += this.container_width;
                if (img.y + img.mov_y > this.container_height) img.mov_y -= this.container_height;
                if (img.y + img.mov_y < -this.photo_height) img.mov_y += this.container_height;

                 if (img.ani) img.ani.kill();
                img.ani = gsap.to(img.node,
                {
                    transform: `translate(${img.mov_x}px,${img.mov_y}px)`,
                    duration,
                });
            });
            this.mouse_x = x;
            this.mouse_y = y;
        },
    };
    photobox.init();
    function isMobile()
    {
        return /Android|iPhone|iPod|IEMobile/i.test(navigator.userAgent) || window.innerWidth <= 768;
    }
    function showMobileAlert()
    {
        if (isMobile()) document.getElementById('mobile-alert').style.display = 'flex';
    }
    function hideMobileAlert()
    {
        document.getElementById('mobile-alert').style.display = 'none';
    }
    window.onload = showMobileAlert;

    document.addEventListener('DOMContentLoaded', () => {
    const photos = document.querySelectorAll('.photos_line_photo img');
    const modal = document.getElementById('imageModal');
    const modalImage = document.getElementById('modalImage');
    const closeModal = document.getElementById('closeModal');
    const commentsSection = document.getElementById('commentsSection');
    const commentInput = document.getElementById('commentInput');
    const submitComment = document.getElementById('submitComment');

    // 点击图片，显示弹窗
    photos.forEach(photo => {
        photo.addEventListener('click', () => {
            modalImage.src = photo.src; // 将图片传递到弹窗
            modal.classList.add('show');
        });
    });

    // 关闭弹窗
    closeModal.addEventListener('click', () => {
        modal.classList.remove('show');
    });

    modal.addEventListener('click', (e) => {
        if (e.target === modal) {
            modal.classList.remove('show');
        }
    });

    // 提交评论
    submitComment.addEventListener('click', () => {
        const commentText = commentInput.value.trim();
        if (commentText) {
            const comment = document.createElement('div');
            comment.classList.add('comment');
            comment.innerHTML = `
                <img src="avatar-placeholder.png" alt="头像" class="avatar">
                <div class="comment-info">
                    <p class="username">匿名用户</p>
                    <p class="comment-text">${commentText}</p>
                </div>
            `;
            commentsSection.appendChild(comment);
            commentInput.value = ''; // 清空输入框
        }
    });
});
</script>
